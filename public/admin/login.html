<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Accesso — eCura Admin</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#3d6b78,#068D86 55%,#045e59)}
  .card{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:32px;width:100%;max-width:380px;margin:16px}
  h1{margin:0 0 4px;font-size:24px;color:#1f2937;text-align:center}
  p.sub{margin:0 0 24px;color:#6b7280;font-size:14px;text-align:center}
  label{display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:4px}
  input{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:16px;margin-bottom:16px}
  input:focus{outline:2px solid #068D86;border-color:transparent}
  button{width:100%;border:0;border-radius:8px;padding:11px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#068D86,#3d6b78);cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  #err{display:none;margin-bottom:16px;padding:10px 12px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>eCura Admin</h1>
  <p class="sub">Pannello di Amministrazione</p>
  <div id="err" role="alert"></div>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" type="text" value="admin" autocomplete="username">
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Accedi</button>
  </form>
</div>
<script>
(async function () {
  // Se la sessione e' gia' valida, vai direttamente alla dashboard
  try { var s = await fetch('/api/admin/auth', { credentials: 'same-origin' }); if (s.ok) { location.replace('/admin/dashboard.html'); return; } } catch (e) {}
  var f = document.getElementById('f'), b = document.getElementById('b'), err = document.getElementById('err');
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    b.disabled = true; b.textContent = 'Accesso…'; err.style.display = 'none';
    try {
      var r = await fetch('/api/admin/auth', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
      });
      var d = {}; try { d = await r.json(); } catch (x) {}
      if (r.ok && d.ok) { location.replace('/admin/dashboard.html'); return; }
      err.textContent = d.error || 'Credenziali non valide'; err.style.display = 'block';
    } catch (x) { err.textContent = 'Errore di rete, riprova.'; err.style.display = 'block'; }
    b.disabled = false; b.textContent = 'Accedi';
  });
})();
</script>
</body>
</html>
