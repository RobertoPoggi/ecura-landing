<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eCura Admin — Login</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #080E49 0%, #068D86 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .logo-wrap {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-wrap img {
    height: 40px;
    width: auto;
  }
  .logo-wrap h1 {
    font-size: 1rem;
    color: #666;
    margin-top: 8px;
    font-weight: 400;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: .875rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color .2s;
    outline: none;
  }
  input:focus {
    border-color: #068D86;
  }
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: #068D86;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s, transform .1s;
    margin-top: 8px;
  }
  .btn-primary:hover { background: #057a74; }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
  .error-msg {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: .875rem;
    margin-bottom: 16px;
    display: none;
  }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 3px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo-wrap">
    <img src="/img/logo-ecura-trasp.png" alt="eCura" onerror="this.style.display='none'">
    <h1>Pannello Amministrazione</h1>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm" autocomplete="on">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="admin" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn">Accedi</button>
  </form>
</div>

<script>
(async () => {
  // Check if already logged in
  try {
    const r = await fetch('/api/admin/auth', { credentials: 'include' });
    if (r.ok) {
      const d = await r.json();
      if (d.authenticated) { window.location.href = '/admin/dashboard.html'; return; }
    }
  } catch {}

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Accesso in corso...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const resp = await fetch('/api/admin/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      const data = await resp.json();
      if (resp.ok && data.ok) {
        window.location.href = '/admin/dashboard.html';
      } else {
        errEl.textContent = data.error || 'Errore di autenticazione';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Accedi';
      }
    } catch (err) {
      errEl.textContent = 'Errore di connessione. Riprova.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Accedi';
    }
  });
})();
</script>
</body>
</html>
