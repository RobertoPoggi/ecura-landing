name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ecura-landing → Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve a calcolare le pagine modificate tra il commit precedente e questo (IndexNow)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name ecura-landing

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ecura-landing-db --remote
        continue-on-error: false

      # IndexNow automatico: dopo il deploy notifica SOLO le pagine HTML indicizzabili (presenti in sitemap.xml)
      # modificate dal push. Non e' mai una precondizione del deploy: se fallisce il deploy resta verde.
      # Gli articoli del blog gestiti da D1 si notificano da soli alla pubblicazione (functions/api/admin/articles*).
      - name: IndexNow - notifica le pagine HTML modificate
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          URLS=$(node scripts/changed-urls.mjs "$BEFORE" "$SHA")
          if [ -z "$URLS" ]; then echo "Nessuna pagina HTML indicizzabile modificata: nessun ping"; exit 0; fi
          echo "Pagine da notificare:"; echo "$URLS"
          for ATTEMPT in 1 2 3; do
            sleep 25   # propagazione del deploy: ogni URL deve rispondere 200 prima del ping
            if node ping-indexnow.js $URLS; then exit 0; fi
            echo "Tentativo $ATTEMPT non riuscito"
          done
          echo "IndexNow non notificato (non blocca il deploy)"; exit 1
